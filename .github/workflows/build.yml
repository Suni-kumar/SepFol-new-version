name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle (Disable Wrapper Validation)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
          validate-wrappers: false

      - name: Set up Node.js (v22 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install NPM Dependencies
        run: |
          npm install

      - name: Build Web Assets
        run: |
          npm run build

      - name: Sync Capacitor Android
        run: |
          npx cap sync android

      - name: Restore Debug Keystore
        run: |
          cd android
          base64 -d keystore.b64 > debug.keystore

      - name: Build Native Android APK
        run: |
          cd android
          gradle assembleDebug -PversionCode=${{ github.run_number }} --no-daemon --stacktrace

      - name: Upload SepFol APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SepFol-Android-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
