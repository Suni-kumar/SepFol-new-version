name: Build & Release APK / Web

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-web:
    name: Build Web App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Web Application
        run: npm run build

      - name: Upload Web Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sepfol-web-dist
          path: dist/

  build-android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: false
          haskell: false
          large-packages: false
          swap-storage: false

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci || npm install

      - name: Compile Web Bundle
        run: npm run build

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Fixed Keystore for Direct Updates
        run: |
          mkdir -p app android/app
          keytool -genkeypair -v \
            -keystore app/sepfol_keystore.jks \
            -alias sepfol_key \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "sepfol123" \
            -keypass "sepfol123" \
            -dname "CN=Sepfol, OU=App, O=Sepfol, L=City, S=State, C=IN" || true
          
          if [ -d "android/app" ]; then
            cp -f app/sepfol_keystore.jks android/app/sepfol_keystore.jks || true
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug / Release APK
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace
          elif [ -f "./android/gradlew" ]; then
            cd android
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace
            cd ..
          else
            echo "No native gradle wrapper found. Web bundle is ready and compiled in dist/."
          fi

      - name: Upload Debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sepfol-debug-apk
          path: |
            **/build/outputs/apk/**/*.apk
            dist/
          if-no-files-found: ignore
